name: Validate DHCP switches

on:
  push:
    branches:
      - ci/adguard-dhcp-test
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - branch: adguard-dhcp-status
            tests: tests/components/adguard
            repository: cb12tre/home-assistant-core
            release_patch: false
          - branch: huawei-dhcp-switch
            tests: tests/components/huawei_lte
            repository: cb12tre/home-assistant-core
            release_patch: false
          - branch: 2026.11.2
            tests: tests/components/huawei_lte
            repository: home-assistant/core
            release_patch: huawei-dhcp-2026.11.2.patch
          - branch: 2026.11.2
            tests: tests/components/adguard
            repository: home-assistant/core
            release_patch: adguard-dhcp-2026.11.2.patch
    steps:
      - name: Fetch proposed branch
        run: |
          git clone --depth 1 --branch "${{ matrix.branch }}" "https://github.com/${{ matrix.repository }}.git" source
          git -C source rev-parse HEAD
      - name: Apply 2026.11.2 test patch
        if: matrix.release_patch
        working-directory: source
        run: |
          curl -fsSL "https://raw.githubusercontent.com/cb12tre/home-assistant-core/${{ github.sha }}/.github/${{ matrix.release_patch }}" -o /tmp/release.patch
          git apply --check /tmp/release.patch
          git apply /tmp/release.patch
      - name: Install test dependencies
        working-directory: source
        run: |
          python3 -m pip install --user uv
          export PATH="$HOME/.local/bin:$PATH"
          uv python install 3.14.10
          uv venv
          uv pip install -e . -e packages/pytest-homeassistant -r requirements_test.txt adguardhome==1.0.0 aiohasupervisor==0.11.0 huawei-lte-api==1.11.0 url-normalize==3.1.0
      - name: Generate English translations
        working-directory: source
        run: .venv/bin/python -m script.translations develop --all
      - name: Run integration tests
        working-directory: source
        run: |
          set -o pipefail
          echo "Testing ${{ matrix.branch }} with ${{ matrix.tests }}"
          .venv/bin/python -m pytest -q --timeout=30 "${{ matrix.tests }}" 2>&1 | tee /tmp/dhcp-test.log || {
            message=$(tail -30 /tmp/dhcp-test.log | tr '\n' ' ' | sed 's/%/%25/g')
            echo "::error::Pytest failed: $message"
            exit 1
          }
